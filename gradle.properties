# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Fabric Properties (Minecraft 26.1.x - unobfuscated, Mojang official mappings)
# Verified to compile and run against both 26.1 and 26.1.2.
#
# NOTE: these are *build-time* versions only (what we compile against). The runtime
# compatibility window users see lives in src/main/resources/fabric.mod.json and is
# deliberately hard-coded to "fabricloader": ">=0.19" / "minecraft": "~26.1"
# so that bumping these cannot accidentally narrow it.
minecraft_version=26.1.2
loader_version=0.19.5
loom_version=1.18.2

# Mod Properties
# 2.0.1 is the parity release. Beyond the 1.x ports it fixes the mechanics that still differed
# from the Forge original (tray sneak behaviour, grill cooling, client-side state changes),
# adds JEI pages, and makes the grill mount a lit campfire the way the original does.
mod_version=2.0.1
maven_group=com.mao
archives_base_name=barbeques-delight

# Dependencies
fabric_api_version=0.155.3+26.1.2
# Farmer's Delight Refabricated for 26.1.x (vendored in ./libs, not bundled)
farmersdelight_version=26.1-3.6.26