plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// Farmer's Delight Refabricated is distributed through Modrinth rather than a
	// public Maven; its jar is vendored in ./libs so builds stay reproducible.
	flatDir {
		name = 'libs'
		dirs 'libs'
	}
}

loom {
	mods {
		"barbequesdelight" {
			sourceSet sourceSets.main
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Optional integrations and hard dependencies that are not on a public Maven are
	// vendored in ./libs. "compile" jars are compiled against but never bundled;
	// "runtime" jars only supply the dev-run classpath.
	compileOnly fileTree(dir: 'libs/compile', include: ['*.jar'])
	localRuntime fileTree(dir: 'libs/runtime', include: ['*.jar'])
}

processResources {
	// Only the mod version is templated into fabric.mod.json. Its `depends` block is
	// intentionally written out in full (not derived from gradle.properties) so that
	// changing a build-only dependency version cannot silently narrow the loader or
	// Minecraft compatibility window:
	//     "fabricloader": ">=0.19"    matches Farmer's Delight Refabricated
	//     "minecraft":    "~26.1"     covers 26.1, 26.1.1 and 26.1.2
	// Note that "~26.1.2" would mean [26.1.2, 26.2) and would wrongly reject 26.1/26.1.1.
	def props = [
		"version": project.version
	]
	inputs.properties props

	filteringCharset "UTF-8"

	filesMatching("fabric.mod.json") {
		expand props
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.encoding = "UTF-8"
	it.options.release = 25
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName" }
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}
	repositories {
	}
}
